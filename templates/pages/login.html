{% extends "components/base.html" %}

{% block header %}
<header>
    <nav aria-label="Navegação">
        <a href="/"><strong>PyCEP</strong></a>
    </nav>
    <h1>Login</h1>
    <p>Acesse sua conta para gerenciar tokens e consultas.</p>
</header>
{% endblock %}

{% block content %}
<section>
    {% if error %}
        <p class="error-msg">{{ error }}</p>
    {% endif %}

    <form class="auth-form" action="{{ url_for('user_post_login') }}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="username" placeholder="seu@email.com" autocomplete="email" required autofocus>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="********" autocomplete="current-password" required>

        <button type="submit">Entrar</button>
    </form>

    <p class="auth-links">
        Não tem conta? <a href="{{ url_for('user_create') }}">Cadastre-se</a>
    </p>
</section>
{% endblock %}

{% block script %}
<script>
    document.querySelector('.auth-form').addEventListener('submit', function() {
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Entrando...';
    });
</script>
{% endblock %}
