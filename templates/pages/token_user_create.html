{% extends "components/base.html" %}

{% block content %}
<section>
    <h2>Novo Token</h2>
    <p>Dê um nome descritivo para identificar onde este token será usado.</p>

    {% if error %}
        <p class="error-msg">{{ error | format_error }}</p>
    {% endif %}

    <form class="auth-form" method="POST" action="{{ url_for('user_post_token_create') }}">
        <label for="name">Nome do token</label>
        <input type="text" id="name" name="name" required placeholder="Ex: meu-ecommerce" minlength="3" maxlength="50" autofocus>

        <button type="submit">Criar token</button>
    </form>

    <p class="auth-links">
        <a href="{{ url_for('user_token') }}">Voltar para tokens</a>
    </p>
</section>
{% endblock %}
