{% extends "components/admin/base.html" %}

{% block header %}
<header>
    <nav aria-label="Navegação">
        <a href="/"><strong>PyCEP</strong></a>
    </nav>
    <h1>Admin Login</h1>
    <p>Painel administrativo da plataforma.</p>
</header>
{% endblock %}

{% block content %}
<section>
    {% if error %}
        <p class="error-msg">{{ error }}</p>
    {% endif %}

    <form class="auth-form" action="{{ url_for('login') }}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="username" placeholder="admin@pycep.com" autocomplete="email" required autofocus>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="********" autocomplete="current-password" required>

        <button type="submit">Entrar</button>
    </form>
</section>
{% endblock %}
