{% extends "components/admin/base.html" %}

{% block header %}
<header>
    <nav aria-label="Navegação">
        <a href="/" class="nav-logo">Py<span>CEP</span></a>
    </nav>
    <h1>Admin Login</h1>
    <p>Painel administrativo da plataforma.</p>
</header>
{% endblock %}

{% block content %}
<section class="animate-in">
    {% if error %}
        <p class="error-msg" style="max-width:24rem;margin:0 auto 1rem;">{{ error }}</p>
    {% endif %}

    <form class="auth-form" action="{{ url_for('login') }}" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="username" placeholder="admin@pycep.com" autocomplete="email" required autofocus>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="********" autocomplete="current-password" required>

        <button type="submit">Entrar</button>
    </form>
</section>
{% endblock %}

{% block script %}
<script>
    document.querySelector('.auth-form').addEventListener('submit', function() {
        const btn = this.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Entrando...';
    });
</script>
{% endblock %}
