<header>
    {% if request.state.user %}
    <nav aria-label="Navegação do painel">
        <a href="/"><strong>PyCEP</strong></a>
        <a href="{{ url_for('user_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('user_token') }}">Tokens</a>
        <a href="{{ url_for('user_logout') }}">Sair</a>
    </nav>
    <h1>Olá, {{ request.state.user.name }}</h1>
    <p>Gerencie seus tokens e integre a API no seu projeto.</p>
    {% else %}
    <nav aria-label="Navegação">
        <a href="/"><strong>PyCEP</strong></a>
        <a href="{{ url_for('user_login') }}">Login</a>
    </nav>
    <h1>PyCEP</h1>
    <p>Consulta rápida de endereço via API.</p>
    {% endif %}
</header>
