<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}{{ title }} — PyCEP Admin{% else %}PyCEP Admin{% endif %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/fonts.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/simple.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.min.css') }}">
    {% block head %}{% endblock %}
</head>
<body>

{% block header %}
{% include "components/admin/header.html" %}
{% endblock %}

<main>
    {% block content %}{% endblock %}
</main>

{% block script %}{% endblock %}

{% include "components/admin/footer.html" %}

</body>
</html>
